name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 버전 자리"
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PRODUCT_NAME: "Terminal++"
  BINARY_NAME: terminal-plus-plus
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  release:
    name: Windows 단독 실행 파일 릴리스
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 기존 releases 페이지의 마지막 버전을 읽어서 다음 버전을 정한다.
      # 릴리스가 없거나 버전을 못 읽으면 package.json 의 version 을 기준으로 삼는다.
      - name: 다음 버전 계산
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $parsed = @()
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            foreach ($tag in @($raw)) {
              $tag = "$tag".Trim()
              if ($tag -match '^[vV]?(\d+)\.(\d+)\.(\d+)$') {
                $parsed += [pscustomobject]@{
                  Tag   = $tag
                  Major = [int]$Matches[1]
                  Minor = [int]$Matches[2]
                  Patch = [int]$Matches[3]
                }
              }
            }
          }

          $previousTag = ''
          if ($parsed.Count -gt 0) {
            $base = $parsed | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
            $previousTag = $base.Tag
            $source = "releases 페이지 ($previousTag)"
          }
          else {
            $pkg = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
            if ("$($pkg.version)" -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              throw "릴리스도 없고 package.json 의 version 도 읽을 수 없습니다: '$($pkg.version)'"
            }
            $base = [pscustomobject]@{
              Major = [int]$Matches[1]
              Minor = [int]$Matches[2]
              Patch = [int]$Matches[3]
            }
            $source = "package.json ($($pkg.version))"
          }

          $current = "$($base.Major).$($base.Minor).$($base.Patch)"
          switch ($env:BUMP) {
            'major' { $next = "$($base.Major + 1).0.0" }
            'minor' { $next = "$($base.Major).$($base.Minor + 1).0" }
            'patch' { $next = "$($base.Major).$($base.Minor).$($base.Patch + 1)" }
            default { throw "알 수 없는 bump 값입니다: '$env:BUMP'" }
          }
          $tag = "v$next"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "릴리스 $tag 가 이미 존재합니다."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$next"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "previous_version=$current"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "previous_tag=$previousTag"

          $summary = @(
            '## 버전',
            '',
            '| 항목 | 값 |',
            '| --- | --- |',
            "| 기준 버전 | ``$current`` (출처: $source) |",
            "| 증가 단위 | ``$env:BUMP`` |",
            "| 새 버전 | ``$next`` |"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Node 20 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Rust 툴체인 준비
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # package.json · tauri.conf.json · Cargo.toml(워크스페이스 전체)에 새 버전을 기록한다.
      - name: 버전 반영
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          function Write-Text([string]$Path, [string]$Text) {
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $Path).Path, $Text, $utf8)
          }

          # JSON 파일의 첫 번째 "version" 필드만 바꾼다.
          function Set-JsonVersion([string]$Path) {
            $raw = Get-Content -Raw -LiteralPath $Path
            $re = [regex]'("version"\s*:\s*")[^"]*(")'
            if (-not $re.IsMatch($raw)) { throw "$Path 에서 version 필드를 찾지 못했습니다." }
            Write-Text $Path $re.Replace($raw, ('${1}' + $version + '${2}'), 1)
            Write-Host "$Path -> $version"
          }

          # Cargo.toml 의 [package] version 과 워크스페이스 크레이트 path 의존성 version 을 바꾼다.
          function Set-CargoVersion([string]$Path) {
            $raw = Get-Content -Raw -LiteralPath $Path
            $packageRe = [regex]'(\[package\][^\[]*?\r?\nversion\s*=\s*")[^"]*(")'
            if (-not $packageRe.IsMatch($raw)) { throw "$Path 에서 [package] version 을 찾지 못했습니다." }
            $raw = $packageRe.Replace($raw, ('${1}' + $version + '${2}'), 1)

            $depRe = [regex]'(?m)^(rterm-(?:core|pty|term)\s*=\s*\{\s*version\s*=\s*")[^"]*(")'
            $raw = $depRe.Replace($raw, ('${1}' + $version + '${2}'))

            Write-Text $Path $raw
            Write-Host "$Path -> $version"
          }

          Set-JsonVersion 'package.json'
          Set-JsonVersion 'src-tauri/tauri.conf.json'

          Set-CargoVersion 'src-tauri/Cargo.toml'
          foreach ($manifest in Get-ChildItem -Path 'src-tauri/crates' -Filter 'Cargo.toml' -Recurse) {
            Set-CargoVersion $manifest.FullName
          }

          # 바뀐 크레이트 버전을 Cargo.lock 에 반영한다 (워크스페이스 멤버만).
          cargo update --workspace --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo update 실패" }

      - name: 프론트엔드 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Windows 단독 실행 파일 빌드
        run: pnpm exec tauri build --no-bundle --target ${{ env.RUST_TARGET }}

      # 번들(설치 파일) 없이 만들어진 단독 exe 를 릴리스용 이름으로 복사한다.
      - name: 실행 파일 수집
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) "src-tauri/target/$env:RUST_TARGET/release/$env:BINARY_NAME.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "빌드된 실행 파일을 찾지 못했습니다: $exe" }

          $outDir = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $name = "$env:BINARY_NAME-v$env:VERSION-windows-x86_64.exe"
          $dest = Join-Path $outDir $name
          Copy-Item -LiteralPath $exe -Destination $dest -Force

          $sha = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLower()
          $sizeMb = [math]::Round((Get-Item -LiteralPath $dest).Length / 1MB, 1)

          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$dest"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_mb=$sizeMb"

      # 이전 릴리스 태그부터 지금까지의 커밋을 릴리스 본문에 넣는다.
      - name: 변경 이력 작성
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          ASSET_NAME: ${{ steps.artifact.outputs.name }}
          ASSET_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ASSET_SIZE_MB: ${{ steps.artifact.outputs.size_mb }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $previousTag = $env:PREVIOUS_TAG
          $hasPrevious = $false
          if ($previousTag) {
            git rev-parse -q --verify "refs/tags/$previousTag" | Out-Null
            $hasPrevious = ($LASTEXITCODE -eq 0)
          }

          if ($hasPrevious) {
            $heading = "### 변경 이력 ($previousTag -> $env:TAG)"
            $commits = git log --no-merges --pretty=format:'- %s (%h)' "$previousTag..HEAD"
          }
          elseif ($previousTag) {
            # 릴리스는 있는데 태그를 못 찾은 경우 — 전체 커밋을 대신 싣는다.
            $heading = "### 변경 이력 (이전 태그 $previousTag 를 찾지 못해 전체 커밋을 표시합니다)"
            $commits = git log --no-merges --pretty=format:'- %s (%h)' -n 200
          }
          else {
            $heading = "### 변경 이력 (최초 릴리스)"
            $commits = git log --no-merges --pretty=format:'- %s (%h)' -n 200
          }
          if ($LASTEXITCODE -ne 0) { throw "git log 실패" }

          $commits = @($commits) | Where-Object { $_ }
          if ($commits.Count -eq 0) { $commits = @('- 변경된 커밋이 없습니다.') }

          $lines = @()
          $lines += $heading
          $lines += ''
          $lines += $commits
          $lines += ''
          $lines += '### 다운로드'
          $lines += ''
          $lines += "- ``$env:ASSET_NAME`` — 설치가 필요 없는 Windows(x64) 단독 실행 파일 · $env:ASSET_SIZE_MB MB"
          $lines += "  - SHA256: ``$env:ASSET_SHA256``"
          $lines += '  - 실행에는 WebView2 런타임이 필요합니다 (Windows 11 기본 포함).'
          $lines += ''
          $lines += "빌드 커밋: ``$env:GITHUB_SHA``"
          if ($hasPrevious) {
            $lines += ''
            $lines += "**Full Changelog**: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/compare/$previousTag...$env:TAG"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $lines -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$notesPath"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content -Raw -LiteralPath $notesPath)

      - name: 릴리스 생성 및 실행 파일 업로드
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_PATH: ${{ steps.artifact.outputs.path }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          gh release create $env:TAG $env:ASSET_PATH `
            --title "$env:PRODUCT_NAME $env:TAG" `
            --notes-file $env:NOTES_PATH `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "릴리스 생성 실패" }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "릴리스: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
